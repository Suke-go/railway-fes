name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# tauri-action needs to write to the repo (create releases, attach assets).
permissions:
  contents: write

# Each matrix entry produces a Tauri build for one macOS target. Apple
# Silicon (aarch64) is `macos-latest`; Intel runners stay on the older image
# until GitHub deprecates them.
#
# Tagged pushes (`v*`): each matrix job publishes its built .dmg / .app into
# a single GitHub Release named after the tag. `max-parallel: 1` serializes
# them so the second job appends to the release the first job created
# instead of racing it.
jobs:
  build-mac:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install npm deps
        working-directory: app
        run: npm ci

      - name: Fetch bundled ffmpeg sidecar
        working-directory: app
        run: npm run fetch-ffmpeg

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: --target ${{ matrix.target }}
          # Tagged runs publish a real Release (not draft) with the .dmg /
          # .app attached. Non-tag runs skip the release step entirely and
          # just upload build artifacts in the step below.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Receipt {0}', github.ref_name) || '' }}
          releaseDraft: false
          prerelease: false

      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: receipt-${{ matrix.target }}
          path: |
            app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            app/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: warn
